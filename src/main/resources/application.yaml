spring:
  application:
    name: deal

  datasource:
    url: jdbc:mysql://localhost:3306/deals?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway owns schema changes; Hibernate must not generate DDL.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # every DATETIME column is UTC
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:harnkan}
    password: ${RABBITMQ_PASSWORD:harnkan}
    # create-deal publishes synchronously; fail fast instead of hanging if the broker is down
    connection-timeout: 2s

server:
  port: 8081

# gateway: trust X-User-Id / X-User-Name from the API gateway (default)
# jwt:     verify the bearer token here with JWT_SECRET (direct calls while developing)
auth:
  mode: ${AUTH_MODE:gateway}

deal:
  jwt-secret: ${JWT_SECRET:}
  scheduler:
    enabled: true
    interval-ms: 30000

# gRPC server exposing DealService (CreateDeal, GetDeal, CancelDeal, UpdateParticipantPayment)
grpc:
  server:
    port: 9090

# gRPC client
payment:
  service:
    host: ${PAYMENT_SERVICE_HOST:localhost}
    port: ${PAYMENT_SERVICE_PORT:9091}
    # zone of Payment's JVM, used to read its zone-less reserved_until
    timezone: ${PAYMENT_SERVICE_TIMEZONE:UTC}

# Runs only the Deal Service. MySQL and RabbitMQ come from ../docker-dependencies (start that first).
services:

  deal-service:
    build: .
    container_name: harnkan-deal-service
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/deals?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      PAYMENT_SERVICE_HOST: ${PAYMENT_SERVICE_HOST:-host.docker.internal}
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT:-9091}
      PAYMENT_SERVICE_TIMEZONE: ${PAYMENT_SERVICE_TIMEZONE:-UTC}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-harnkan}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-harnkan}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [harnkan-net]

networks:
  harnkan-net:
    external: true
